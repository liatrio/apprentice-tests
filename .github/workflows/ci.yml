name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start example app
        run: |
          node example/server.mjs &
          sleep 1
      - name: Run checks
        uses: ./
        with:
          url: http://localhost:8080/
